name: Relógio (aula das 8h)

# O agendamento do GitHub atrasa. Este relógio espera até 07:00 (Brasília) e dispara a "Aula do dia",
# que fica pronta antes das 8h e é agendada no YouTube para ficar pública às 08:00.
# Depois ele VIGIA: se até 08:15 a aula de hoje não saiu (cancelada, erro, travou), dispara de novo
# (até 3 tentativas, vigiando até as 11:00). Ao terminar, ele mesmo agenda o próximo.
# Os "cron" abaixo só religam a corrente se ela cair.
on:
  schedule:
    - cron: "13 6 * * *"
    - cron: "43 18 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: relogio
  cancel-in-progress: true

jobs:
  esperar:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Esperar o horário, disparar a aula e vigiar
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import base64, json, os, subprocess, time
          from datetime import datetime, timedelta, timezone
          BR = timezone(timedelta(hours=-3))
          REPO = os.environ["REPO"]
          DISPAROS = [(7, 0)]
          CONFERIR = (8, 15)      # primeira conferência
          ATE = (11, 0)           # para de vigiar neste horário
          TENTATIVAS = 3          # novas tentativas além da primeira

          def gh(*a):
              return subprocess.run(["gh", *a], capture_output=True, text=True)

          def disparar(qual, *extra):
              for _ in range(5):
                  if gh("workflow", "run", qual, "-R", REPO, *extra).returncode == 0:
                      return True
                  time.sleep(20)
              return False

          def aula_saiu(hoje):
              r = gh("api", f"repos/{REPO}/contents/docs/curso_estado.json?ref=main", "--jq", ".content")
              try:
                  estado = json.loads(base64.b64decode(r.stdout))
                  return estado.get("ultima_data") == hoje
              except Exception:
                  return False

          def aula_rodando():
              r = gh("run", "list", "-R", REPO, "--workflow", "aula.yml", "--limit", "10", "--json", "status")
              try:
                  return any(x["status"] in ("in_progress", "queued", "waiting", "pending") for x in json.loads(r.stdout))
              except Exception:
                  return False

          agora = datetime.now(BR)
          proximos = [(agora + timedelta(days=d)).replace(hour=h, minute=m, second=0, microsecond=0)
                      for d in (0, 1) for h, m in DISPAROS]
          alvo = min(t for t in proximos if t > agora - timedelta(minutes=1))
          espera = (alvo - agora).total_seconds()
          LIMITE = 5 * 3600 + 30 * 60
          if espera > 3600:   # longe do disparo: dorme e passa o bastão (sobra tempo para vigiar depois)
              soneca = min(espera - 1800, LIMITE)
              print(f"{agora:%H:%M} → próximo disparo {alvo:%d/%m %H:%M}; espero {soneca / 3600:.1f}h e passo o bastão")
              time.sleep(soneca)
          else:
              print(f"{agora:%H:%M} → esperando até {alvo:%d/%m %H:%M} ({espera / 60:.0f} min)")
              time.sleep(max(0, espera))
              if disparar("aula.yml", "-f", "agendado=sim"):
                  print("✅ aula disparada")

              # ── vigia ──
              hoje = alvo.date().isoformat()
              conferir = alvo.replace(hour=CONFERIR[0], minute=CONFERIR[1])
              fim = alvo.replace(hour=ATE[0], minute=ATE[1])
              time.sleep(max(0, (conferir - datetime.now(BR)).total_seconds()))
              tentativas = 0
              while datetime.now(BR) < fim:
                  if aula_saiu(hoje):
                      print(f"{datetime.now(BR):%H:%M} ✅ aula de hoje publicada"); break
                  if aula_rodando():
                      print(f"{datetime.now(BR):%H:%M} aula ainda sendo gerada… confiro em 10 min")
                  elif tentativas < TENTATIVAS:
                      tentativas += 1
                      print(f"{datetime.now(BR):%H:%M} ⚠️ aula não saiu — tentativa extra {tentativas}/{TENTATIVAS}")
                      disparar("aula.yml", "-f", "agendado=sim")
                      time.sleep(120)
                  else:
                      print("❌ aula não saiu depois de todas as tentativas — ver a 'Aula do dia' no Actions"); break
                  time.sleep(600)

          disparar("relogio.yml")
          PY
